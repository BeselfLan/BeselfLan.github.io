name: web

on:
  pull_request:
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep private and heavy files out of the repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)(info\.txt|prompt\.txt|plan\.txt|\.env)$|\.gif$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm
      - name: Run the npm gates
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run check
