# The backend: the API behind one Caddy, and a media folder both can see.
# Values come from deploy/.env (copy deploy/.env.example). For a laptop run
# add -f deploy/docker-compose.local.yml; deploy/smoke.sh shows the commands.
name: beselfos
services:
  api:
    image: ${API_IMAGE:-beselfos-api:local}
    restart: unless-stopped
    init: true
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in deploy/.env}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:?set PUBLIC_MEDIA_BASE_URL in deploy/.env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DMOJ_USER: ${DMOJ_USER:-}
      GITHUB_USER: ${GITHUB_USER:-}
    volumes:
      # A host folder, so scripts/media/sync.sh can reach it over SSH: media/
      # next to this file (/srv/beselfos/media on the VPS) by default.
      - ${MEDIA_HOST_DIR:-./media}:/media
    # No ports. The API trusts one proxy hop, so a client that reached it
    # directly could choose its own address and skip the contact rate limit.
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_SITE: ${API_SITE:?set API_SITE in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_HOST_DIR:-./media}:/media:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
volumes:
  caddy_data:
  caddy_config:
