<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original artwork for this site: a warm gradient, soft ellipses and fine grain. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e95420"/>
      <stop offset="1" stop-color="#c34113"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="300" cy="190" rx="400" ry="230" fill="#ff8a4d" opacity="0.38"/>
    <ellipse cx="1150" cy="720" rx="460" ry="250" fill="#8f2f0c" opacity="0.5"/>
    <ellipse cx="760" cy="470" rx="260" ry="140" fill="#f06a35" opacity="0.3"/>
  </g>
  <rect width="1440" height="900" filter="url(#grain)" opacity="0.04"/>
</svg>
