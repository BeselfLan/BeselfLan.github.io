<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original artwork for this site: a diagonal gradient, three soft shapes and fine grain. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c001e"/>
      <stop offset="0.55" stop-color="#772953"/>
      <stop offset="1" stop-color="#e95420"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="1190" cy="160" rx="380" ry="210" fill="#e95420" opacity="0.4"/>
    <ellipse cx="240" cy="770" rx="430" ry="230" fill="#2c001e" opacity="0.6"/>
    <path d="M-120 540 C 240 380 520 660 820 510 S 1300 380 1560 540 V 1000 H -120 Z" fill="#5e2750" opacity="0.45"/>
  </g>
  <rect width="1440" height="900" filter="url(#grain)" opacity="0.04"/>
</svg>
