<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original artwork for this site: a grey gradient, a soft wave and fine grain. -->
  <defs>
    <linearGradient id="base" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#base)"/>
  <g filter="url(#soft)">
    <path d="M-100 300 C 300 120 640 420 960 260 S 1380 140 1560 260 V -100 H -100 Z" fill="#5a5a5a" opacity="0.45"/>
    <ellipse cx="420" cy="760" rx="440" ry="200" fill="#101010" opacity="0.55"/>
    <ellipse cx="1220" cy="650" rx="300" ry="170" fill="#4a4a4a" opacity="0.4"/>
  </g>
  <rect width="1440" height="900" filter="url(#grain)" opacity="0.04"/>
</svg>
